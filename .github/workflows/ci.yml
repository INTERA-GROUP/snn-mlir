name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:

  python:
    name: Python – lint & tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check python/

      - name: Test
        run: uv run pytest python/tests/ -v

  dialect:
    name: C++ dialect – build & lit tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Cache LLVM 22
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: /usr/lib/llvm-22
          key: llvm-22-ubuntu-24.04

      - name: Install LLVM/MLIR 22
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y libmlir-22-dev mlir-22-tools llvm-22-tools

      - name: Install build tools & lit
        run: |
          sudo apt-get install -y ninja-build
          pipx install lit

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-${{ runner.os }}-llvm22-${{ hashFiles('CMakeLists.txt', 'include/**', 'lib/**', 'tools/**') }}
          restore-keys: |
            cmake-${{ runner.os }}-llvm22-

      - name: Configure
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DMLIR_DIR=/usr/lib/llvm-22/lib/cmake/mlir \
            -DLLVM_EXTERNAL_LIT=$(which lit) \
            -DFILECHECK_EXE=/usr/lib/llvm-22/bin/FileCheck

      - name: Build snn-opt
        run: ninja -C build snn-opt

      - name: Lit tests
        run: ninja -C build check-snn
