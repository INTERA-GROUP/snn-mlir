[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snn-mlir"
version = "0.4.0"
description = "NIR-to-MLIR frontend and CPU reference for the snn-mlir SNN dialect (export, codegen, and run a spiking network from the command line)"
readme = "README.md"
license = { text = "Apache-2.0 WITH LLVM-exception" }
requires-python = ">=3.10"
keywords = ["mlir", "snn", "spiking-neural-networks", "nir", "compiler", "neuromorphic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "nir>=1.0",
    "numpy>=1.24",
]

[project.scripts]
snn-mlir = "snn_mlir._cli:main"

[project.urls]
Homepage = "https://github.com/INTERA-GROUP/snn-mlir"
Documentation = "https://snn-mlir.readthedocs.io"
Repository = "https://github.com/INTERA-GROUP/snn-mlir"
Paper = "https://arxiv.org/abs/2606.09213"
Issues = "https://github.com/INTERA-GROUP/snn-mlir/issues"

[tool.hatch.build.targets.wheel]
packages = ["python/snn_mlir"]

[tool.hatch.build.targets.sdist]
only-include = ["python/snn_mlir", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

[dependency-groups]
dev = [
    "commitizen>=4",
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.4",
]
docs = [
    "mkdocs-material>=9.7.6",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
# lit.cfg.py uses globals (config, lit_config) injected at runtime by llvm-lit
exclude = ["test/lit.cfg.py"]
