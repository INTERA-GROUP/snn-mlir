[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snn-mlir"
version = "0.2.0a0"
description = "Python NIR bridge for the snn-mlir MLIR dialect"
readme = "README.md"
license = { text = "Apache-2.0 WITH LLVM-exception" }
requires-python = ">=3.10"
dependencies = [
    "nir>=1.0",
    "numpy>=1.24",
]

[tool.hatch.build.targets.wheel]
packages = ["python/snn_mlir"]

[dependency-groups]
dev = [
    "commitizen>=4",
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.4",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
# lit.cfg.py uses globals (config, lit_config) injected at runtime by llvm-lit
exclude = ["test/lit.cfg.py"]
